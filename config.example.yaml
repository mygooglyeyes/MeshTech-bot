# ============================================================
#  MeshTech-Bot - configuration
#
#  This is the EXAMPLE config. On install, copy it and edit:
#      cp config.example.yaml config.yaml
#  Change the values marked "<--", then check it with:
#      python bot.py --check
# ============================================================

# --- Connection to your openHop Repeater --------------------
connection:
  host: "192.168.1.50"      # <-- LAN IP of the machine running openHop Repeater
  port: 5000                # <-- companion port on the repeater. Must match the
                            #     "tcp_port" set in openHop's own config.
  reconnect: true           # keep trying if the connection drops
  reconnect_min_seconds: 3  # wait at least this long between attempts
  reconnect_max_seconds: 60 # ...and at most this long (backoff grows over time)

# --- Bot behaviour -------------------------------------------
bot:
  advertise_on_start: true  # send an advert at startup so nodes can find the bot
  display_name: "me"        # FALLBACK name for replies when the bot can't learn
                            # its companion's name (the companion's node_name
                            # is used automatically when available)
  # Don't answer messages when the sender can't be identified:
  #   false (default) = stay silent (recommended)
  #   true            = answer anyway - only for meshes where sender
  #                     identity is never available
  # Clock-sync the companion at startup? Leave false when the companion
  # keeps its own time (openHop on a Linux box does).
  answer_unknown_senders: false

# --- Hop limits ------------------------------------------------
# MeshCore reports how many hops an incoming message travelled.
# max_inbound_hops: ignore messages that arrived via MORE hops than this.
#                   0 = no limit.
mesh:
  max_inbound_hops: 3
  unknown_hops: "ignore"    # when hop count can't be read:
                            #   "ignore" = play safe, don't answer
                            #   "respond" = answer anyway
  # MeshCore embeds the sender's name in channel messages ("Name: message").
  # How much to trust that embedded name:
  #   "trust" = always strip it (default - commands arrive as "Name: !help")
  #   "smart" = strip it only when the rest of the text wouldn't already match
  #   "off"   = never strip (for gateways that relay messages WITHOUT names)
  channel_sender_name: "trust"

# --- Channels the bot listens on -------------------------------
# Names must match channels on your mesh. The bot checks the repeater's
# channel table and adds missing ones where possible.
# reply: false = "listen-only" - traffic is logged, the bot never answers.
channels:
  - name: "#bot"            # <-- main Q&A channel
    reply: true
  - name: "#test"           # <-- second channel (set reply: false to log only)
    reply: false

# --- Direct messages -------------------------------------------
dm:
  enabled: true
  # Nodes allowed to run control commands (reload, shutdown, full stats).
  # Use the first 12 hex characters of the node's public key - add ONE line
  # per admin node. Find yours by DMing the bot "!nodes" once it's been
  # running, or on the dashboard.
  admin_pubkey_prefixes:
    - "a1b2c3d4e5f6"        # <-- replace with YOUR node's prefix
  # Everyone else can still use the public commands (help, status, nodes).

# --- Reply detail levels ---------------------------------------
# Replies default to the COMPACT version to keep radio traffic short.
# Append "x" for the EXTENDED version:
#   !nodes          -> compact list
#   !nodes x        -> extended list
# The words "brief"/"full" still work if you prefer typing them.
verbosity:
  aliases_brief: []              # compact is the default everywhere
  aliases_full: ["x"]            # the only documented modifier
  channel_default: brief
  dm_default: brief

# --- Database ----------------------------------------------
storage:
  db_path: "data/bot.db"
  contact_refresh_minutes: 30   # how often to refresh the node table from adverts
  # --- Packet capture (for traffic analysis) ---
  # Every decoded companion frame is stored with frame type, hops, SNR,
  # sender and timing.
  capture_packets: true
  # Also store the raw wire bytes of each frame (bulkier; useful for packet
  # size/timing analysis of the companion link).
  packet_raw_hex: false
  # Append-only JSONL analysis file (one JSON object per line, easy to load
  # in pandas). Empty string ("") disables the file.
  packet_jsonl: "data/packets.jsonl"
  # When packets.jsonl grows past this many bytes it is moved aside as
  # packets.jsonl.old and a fresh file starts (so the folder never holds
  # more than roughly two copies). 0 = grow forever (not recommended).
  packet_jsonl_max_bytes: 67108864   # 64 MB
  packet_max_rows: 200000        # keep the last N rows in the database

# ---------------------------------------------------------------------------
# Modules - optional add-on features, managed from the web console's
# Modules card (or by hand here). Each module keeps its own settings.
# Modules that are not listed are simply off. Unknown settings keys are
# preserved, so it is safe to edit while a newer version runs.
#
# Channel settings (#bot, #novato...) work WITH or WITHOUT the leading
# '#' - "#novato" and "novato" are the same channel.
# ---------------------------------------------------------------------------
modules:
  #
  # Weather: `!wx [zip]` (or `!weather [zip]`) on the mesh; optional
  # daily forecast post to a channel at a set local time.
  weather:
    enabled: false
    # zip: "84321"          # default zip for !wx (US)
    # channel: "#bot"       # where the daily forecast posts (off until set)
    # post_time: "07:00"    # local HH:MM for the daily forecast post
  # alerts:               # NWS active alerts: !alerts [zip]
  #   enabled: false
  # quake:                # USGS earthquakes: !quake [zip]
  #   enabled: false
  # Flood guardrails - tune both layers in the console card. Over-limit
  # transmissions are dropped and noted in the activity feed. Admin DMs are
  # exempt. Need more room on a busy day? DM '!up' as an admin (or use the
  # console's Budget up button) to add +30/hour and +150/day per use,
  # up to 90/hour and 2200/day; each boost ages out after 24 hours.
  # '!down' (or the Budget down button) cancels all active boosts at once.
  pushbudget:
    enabled: true
    # Per person - keyword replies only (pushes have no person):
    # person_gap_seconds: 30     # wait between answers to one requester
    # person_max_per_hour: 5     # most answers one person gets per hour
    # person_max_per_day: 15     # most answers one person gets per day
    # Total - everything the bot transmits, replies + pushes combined:
    # gap_seconds: 30      # minimum seconds between transmissions
    # max_per_hour: 30     # most transmissions in any rolling hour
    # max_per_day: 250     # most transmissions in any rolling day

# --- Simple canned answers (no code needed) ----------------------
# When one of these keywords appears in a message, the bot replies with the
# matching text. If several texts are listed, one is chosen at random.
#
# EMPTY by default: this bot is for testing, not chat. Add your own test
# triggers here when you need them:
#
# replies:
#   - keywords: ["ping", "test"]
#     text:
#       - "pong - mesh path OK"
#
replies: []

# --- Limits (keep the mesh happy) -----------------------------
limits:
  min_interval_seconds: 3    # minimum gap between ANY two bot replies
  per_sender_seconds: 30     # ignore repeat DM requests from the same node
  # Per-channel cadence: at most ONE reply per channel every N seconds
  # (0 = off, the default). Stops one busy channel from crowding out
  # replies on the others; DMs are never throttled by this.
  channel_interval_seconds: 0
  # Optional per-channel overrides (channel -> seconds; 0 disables):
  # channel_intervals:
  #   "#bot": 30
  #   "#test": 0
  # Per-sender pace inside CHANNELS: after the bot answers a node in a
  # channel, that node waits this many seconds before it is answered again
  # (admins exempt; 0 = off). One persistent node cannot eat every reply
  # slot in a busy channel.
  per_sender_channel_seconds: 30
  max_reply_length: 133      # MeshCore text limit per message
  max_chunks: 6              # max messages one reply may be split into

# --- Web management dashboard -----------------------------------
# Browser UI at  http://<this machine>:8081
web:
  enabled: true
  host: "127.0.0.1"          # 127.0.0.1 = this machine only (recommended).
                             # To reach the dashboard from other machines,
                             # use "0.0.0.0" and set a real password.
  port: 8081
  # The dashboard password lives in its OWN file (first line = password),
  # NOT in this config - so a leaked config.yaml can't unlock the dashboard.
  # Set it with ONE command (native install):
  #     sudo ./set-password.sh       # prompts twice, saves, restarts the bot
  # The installer (install.sh) also asks during setup. Or set the
  # MESHTECH_DASHBOARD_PASSWORD environment variable - it wins over the file.
  password_file: "data/.dashboard_password"   # <-- recommended
  # LEGACY alternative - password stored in this file. Still works, but it
  # travels with config.yaml and the bot warns about it:
  # password: "change-me"

# --- Logging ----------------------------------------------------
# With the systemd service, leave file empty and watch logs with:
#   journalctl -u meshtech-bot -f
logging:
  level: INFO                # DEBUG, INFO, WARNING, ERROR
  file: ""                   # e.g. "data/bot.log" - empty = console only
  timezone: local            # local | utc | IANA name such as "Europe/London"
